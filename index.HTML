<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Bosque da Bruxa AR - GLB Diagnóstico</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#000;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      touch-action:none;
    }

    video{
      position:fixed !important;
      inset:0 !important;
      width:100vw !important;
      height:100vh !important;
      object-fit:cover !important;
      z-index:0 !important;
      opacity:1 !important;
      visibility:visible !important;
      display:block !important;
      background:#000;
    }

    a-scene,.a-canvas{
      position:fixed !important;
      inset:0 !important;
      width:100vw !important;
      height:100vh !important;
      z-index:2 !important;
      background:transparent !important;
    }

    .mindar-ui-overlay{z-index:5 !important}

    #debug{
      position:fixed;
      left:8px;
      right:8px;
      top:8px;
      z-index:30;
      color:#fff;
      background:rgba(0,0,0,.72);
      padding:9px 11px;
      border-radius:10px;
      font-size:11px;
      line-height:1.4;
      white-space:pre-wrap;
      pointer-events:none;
      max-height:32vh;
      overflow:auto;
      backdrop-filter:blur(8px);
    }

    #status{
      position:fixed;
      left:50%;
      bottom:18px;
      transform:translateX(-50%);
      z-index:30;
      color:#fff;
      background:rgba(0,0,0,.68);
      padding:10px 14px;
      border-radius:999px;
      font-size:13px;
      white-space:nowrap;
      backdrop-filter:blur(8px);
      pointer-events:none;
    }

    #retryBtn,#exploreBtn,#backBtn{
      position:fixed;
      top:16px;
      z-index:40;
      border:0;
      border-radius:999px;
      padding:11px 15px;
      font-weight:700;
      font-size:14px;
      pointer-events:auto;
      display:none;
    }

    #retryBtn{
      right:14px;
      background:#ffdf6c;
      color:#111;
    }

    #exploreBtn{
      right:14px;
      background:#fff;
      color:#111;
    }

    #backBtn{
      left:14px;
      background:rgba(0,0,0,.75);
      color:#fff;
    }
  </style>
</head>

<body>

  <div id="debug">Página carregada.</div>
  <button id="retryBtn">Tentar GLB novamente</button>
  <button id="exploreBtn">Explorar em 3D</button>
  <button id="backBtn">← Voltar ao AR</button>
  <div id="status">Iniciando câmera...</div>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: yes; uiLoading: yes; uiError: yes;"
    embedded
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false"
    renderer="alpha:true; antialias:true; colorManagement:true; physicallyCorrectLights:true">

    <a-entity light="type:ambient; intensity:1.55; color:#ffffff"></a-entity>
    <a-entity light="type:directional; intensity:1.35; color:#ffe8c2" position="-2 4 3"></a-entity>

    <a-entity id="target" mindar-image-target="targetIndex:0">
      <a-entity id="arHolder">
        <a-entity id="arModel"></a-entity>
      </a-entity>
    </a-entity>

    <a-entity id="exploreRoot" visible="false" position="0 0 -3">
      <a-entity id="exploreHolder">
        <a-entity id="exploreModel"></a-entity>
      </a-entity>
    </a-entity>

    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
  </a-scene>

<script>
const MODEL_PATH = "./Casa_da_bruxa_web.glb";

const scene = document.getElementById("scene");
const target = document.getElementById("target");

const arModel = document.getElementById("arModel");
const arHolder = document.getElementById("arHolder");

const exploreRoot = document.getElementById("exploreRoot");
const exploreModel = document.getElementById("exploreModel");
const exploreHolder = document.getElementById("exploreHolder");

const debugEl = document.getElementById("debug");
const statusEl = document.getElementById("status");

const retryBtn = document.getElementById("retryBtn");
const exploreBtn = document.getElementById("exploreBtn");
const backBtn = document.getElementById("backBtn");

let arReady = false;
let modelReady = false;
let modelLoading = false;
let targetSeen = false;
let exploreMode = false;

let blobUrl = null;
let controller = null;

let rotX = 0;
let rotY = 0;
let zoomMultiplier = 1;
let exploreBaseScale = 1;
let dragging = false;
let lastX = 0;
let lastY = 0;
let lastPinch = null;

function log(msg){
  debugEl.textContent += "\n" + msg;
  debugEl.scrollTop = debugEl.scrollHeight;
}

function setStatus(msg){
  statusEl.textContent = msg;
}

function forceVideoVisible(){
  document.querySelectorAll("video").forEach(video => {
    video.setAttribute("playsinline","");
    video.setAttribute("autoplay","");
    video.muted = true;

    Object.assign(video.style,{
      position:"fixed",
      inset:"0",
      width:"100vw",
      height:"100vh",
      objectFit:"cover",
      zIndex:"0",
      opacity:"1",
      visibility:"visible",
      display:"block"
    });

    if(video.paused){
      video.play().catch(()=>{});
    }
  });
}
setInterval(forceVideoVisible,600);

function humanMB(bytes){
  return (bytes / 1024 / 1024).toFixed(2) + " MB";
}

async function fetchModelAsBlob(){
  if(modelLoading || modelReady) return;

  modelLoading = true;
  retryBtn.style.display = "none";

  if(controller){
    try{ controller.abort(); }catch(e){}
  }

  controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 90000);

  const url = MODEL_PATH + "?v=" + Date.now();

  try{
    log("GLB: iniciando fetch");
    log("GLB URL: " + url);
    setStatus("Baixando cenário 3D...");

    const response = await fetch(url,{
      cache:"no-store",
      signal:controller.signal
    });

    log("GLB HTTP: " + response.status + " " + response.statusText);
    log("Content-Type: " + (response.headers.get("content-type") || "(sem content-type)"));

    if(!response.ok){
      throw new Error("HTTP " + response.status);
    }

    const total = Number(response.headers.get("content-length")) || 0;

    if(total){
      log("GLB tamanho informado: " + humanMB(total));
    }else{
      log("GLB sem Content-Length informado.");
    }

    const reader = response.body.getReader();
    const chunks = [];
    let received = 0;
    let lastUi = 0;

    while(true){
      const {done,value} = await reader.read();
      if(done) break;

      chunks.push(value);
      received += value.byteLength;

      const now = performance.now();

      if(now - lastUi > 250){
        lastUi = now;

        if(total){
          const pct = Math.min(100, (received / total) * 100);
          setStatus(`Baixando cenário: ${pct.toFixed(0)}%`);
        }else{
          setStatus("Baixando cenário: " + humanMB(received));
        }
      }
    }

    clearTimeout(timeout);

    log("GLB recebido: " + humanMB(received));

    const blob = new Blob(chunks,{type:"model/gltf-binary"});

    if(blob.size < 1000){
      throw new Error("GLB recebido é pequeno demais");
    }

    if(blobUrl){
      URL.revokeObjectURL(blobUrl);
    }

    blobUrl = URL.createObjectURL(blob);

    log("GLB virou Blob URL.");
    setStatus("Arquivo baixado. Montando o 3D...");

    arModel.setAttribute("gltf-model", blobUrl);
    exploreModel.setAttribute("gltf-model", blobUrl);

  }catch(err){
    clearTimeout(timeout);

    modelLoading = false;

    log("GLB ERRO: " + err.name + " - " + err.message);

    if(err.name === "AbortError"){
      setStatus("Tempo esgotado ao baixar o cenário.");
    }else{
      setStatus("Erro ao baixar/carregar o cenário.");
    }

    retryBtn.style.display = "block";
  }
}

function fitModel(el,holder,desiredSize,label){
  const mesh = el.getObject3D("mesh");

  if(!mesh){
    log(label + ": mesh indisponível.");
    return false;
  }

  mesh.updateMatrixWorld(true);

  const box = new THREE.Box3().setFromObject(mesh);
  const size = new THREE.Vector3();
  const center = new THREE.Vector3();

  box.getSize(size);
  box.getCenter(center);

  const maxDim = Math.max(size.x,size.y,size.z);

  log(
    label + " tamanho: " +
    size.x.toFixed(3) + " x " +
    size.y.toFixed(3) + " x " +
    size.z.toFixed(3)
  );

  if(!isFinite(maxDim) || maxDim <= 0){
    log(label + ": dimensões inválidas.");
    return false;
  }

  el.object3D.position.set(
    -center.x,
    -center.y,
    -center.z
  );

  const s = desiredSize / maxDim;
  holder.object3D.scale.set(s,s,s);

  if(label === "AR"){
    holder.object3D.position.set(0,0.03,0);
    holder.object3D.rotation.set(
      THREE.MathUtils.degToRad(-8),
      0,
      0
    );
  }else{
    holder.object3D.position.set(0,-0.12,0);
    exploreBaseScale = s;
  }

  log(label + " escala automática: " + s.toFixed(7));
  return true;
}

function checkReady(){
  const arOK = !!arModel.getObject3D("mesh");
  const exOK = !!exploreModel.getObject3D("mesh");

  if(arOK && exOK){
    fitModel(arModel,arHolder,0.85,"AR");
    fitModel(exploreModel,exploreHolder,2.0,"EXPLORE");

    modelReady = true;
    modelLoading = false;

    log("GLB pronto nos dois modos.");

    if(targetSeen){
      setStatus("Bosque encontrado!");
      exploreBtn.style.display = "block";
    }else{
      setStatus("Cenário pronto. Aponte para a imagem.");
    }
  }
}

arModel.addEventListener("model-loaded",()=>{
  log("AR: model-loaded");
  setTimeout(checkReady,100);
});

exploreModel.addEventListener("model-loaded",()=>{
  log("EXPLORE: model-loaded");
  setTimeout(checkReady,100);
});

arModel.addEventListener("model-error",event=>{
  modelLoading = false;
  log("AR: model-error depois do Blob.");
  console.error(event);
  setStatus("O GLB baixou, mas o 3D não abriu.");
  retryBtn.style.display = "block";
});

exploreModel.addEventListener("model-error",event=>{
  modelLoading = false;
  log("EXPLORE: model-error depois do Blob.");
  console.error(event);
});

scene.addEventListener("arReady",()=>{
  arReady = true;
  log("AR pronto. Câmera iniciada.");
  setStatus("Câmera pronta. Preparando cenário...");

  setTimeout(fetchModelAsBlob,700);
});

scene.addEventListener("arError",()=>{
  log("Erro ao iniciar AR/câmera.");
  setStatus("Erro ao iniciar câmera/AR.");
});

target.addEventListener("targetFound",()=>{
  targetSeen = true;
  log("Alvo encontrado.");

  if(!exploreMode){
    if(modelReady){
      setStatus("Bosque encontrado!");
      exploreBtn.style.display = "block";
    }else{
      setStatus("Imagem encontrada. Cenário ainda carregando...");
    }
  }
});

target.addEventListener("targetLost",()=>{
  targetSeen = false;
  log("Alvo perdido.");

  if(!exploreMode){
    exploreBtn.style.display = "none";

    if(modelReady){
      setStatus("Aponte novamente para a imagem.");
    }
  }
});

retryBtn.addEventListener("click",()=>{
  retryBtn.style.display = "none";
  fetchModelAsBlob();
});

exploreBtn.addEventListener("click",()=>{
  if(!modelReady) return;

  exploreMode = true;

  target.setAttribute("visible",false);
  exploreRoot.setAttribute("visible",true);

  exploreBtn.style.display = "none";
  backBtn.style.display = "block";

  setStatus("Arraste para girar • pinça para zoom");
});

backBtn.addEventListener("click",()=>{
  exploreMode = false;

  exploreRoot.setAttribute("visible",false);
  target.setAttribute("visible",true);

  backBtn.style.display = "none";

  if(targetSeen && modelReady){
    exploreBtn.style.display = "block";
    setStatus("Bosque encontrado!");
  }else{
    setStatus("Aponte para a imagem.");
  }
});

function applyExploreTransform(){
  exploreHolder.object3D.rotation.set(
    THREE.MathUtils.degToRad(rotX),
    THREE.MathUtils.degToRad(rotY),
    0
  );

  const s = exploreBaseScale * zoomMultiplier;

  exploreHolder.object3D.scale.set(s,s,s);
}

window.addEventListener("pointerdown",event=>{
  if(!exploreMode) return;
  if(event.target === backBtn || event.target === exploreBtn) return;

  dragging = true;
  lastX = event.clientX;
  lastY = event.clientY;
});

window.addEventListener("pointermove",event=>{
  if(!exploreMode || !dragging) return;

  const dx = event.clientX - lastX;
  const dy = event.clientY - lastY;

  rotY += dx * 0.45;
  rotX += dy * 0.25;

  rotX = Math.max(-60,Math.min(60,rotX));

  lastX = event.clientX;
  lastY = event.clientY;

  applyExploreTransform();
});

window.addEventListener("pointerup",()=>dragging=false);
window.addEventListener("pointercancel",()=>dragging=false);

window.addEventListener("touchstart",event=>{
  if(!exploreMode) return;

  if(event.touches.length === 2){
    const a = event.touches[0];
    const b = event.touches[1];

    lastPinch = Math.hypot(
      b.clientX-a.clientX,
      b.clientY-a.clientY
    );
  }
},{passive:false});

window.addEventListener("touchmove",event=>{
  if(!exploreMode || event.touches.length !== 2) return;

  event.preventDefault();

  const a = event.touches[0];
  const b = event.touches[1];

  const d = Math.hypot(
    b.clientX-a.clientX,
    b.clientY-a.clientY
  );

  if(lastPinch){
    zoomMultiplier *= d / lastPinch;
    zoomMultiplier = Math.max(0.25,Math.min(4,zoomMultiplier));
    applyExploreTransform();
  }

  lastPinch = d;
},{passive:false});

window.addEventListener("touchend",()=>lastPinch=null);
</script>
</body>
</html>
