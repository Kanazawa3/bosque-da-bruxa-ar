<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Bosque da Bruxa AR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#000;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    }

    video{
      position:fixed !important;
      inset:0 !important;
      width:100vw !important;
      height:100vh !important;
      object-fit:cover !important;
      z-index:0 !important;
      opacity:1 !important;
      visibility:visible !important;
      display:block !important;
      background:#000;
    }

    a-scene,.a-canvas{
      position:fixed !important;
      inset:0 !important;
      width:100vw !important;
      height:100vh !important;
      z-index:2 !important;
      background:transparent !important;
    }

    .mindar-ui-overlay{
      z-index:5 !important;
    }

    #status{
      position:fixed;
      left:50%;
      bottom:18px;
      transform:translateX(-50%);
      z-index:50;
      color:#fff;
      background:rgba(0,0,0,.68);
      padding:10px 14px;
      border-radius:999px;
      font-size:13px;
      white-space:nowrap;
      backdrop-filter:blur(8px);
      pointer-events:none;
      max-width:88vw;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    #exploreBtn,#backBtn,#retryBtn{
      position:fixed;
      top:16px;
      z-index:60;
      border:0;
      border-radius:999px;
      padding:11px 15px;
      font-weight:700;
      font-size:14px;
      display:none;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }

    #exploreBtn,#retryBtn{
      right:14px;
      background:#fff;
      color:#111;
    }

    #retryBtn{
      background:#ffdf6c;
    }

    #backBtn{
      left:14px;
      background:rgba(0,0,0,.78);
      color:#fff;
    }

    /*
      Esta camada só existe no modo Explorar.
      Assim o giro/zoom não interfere com o AR nem com os botões.
    */
    #touchLayer{
      position:fixed;
      inset:0;
      z-index:30;
      display:none;
      touch-action:none;
      background:transparent;
    }

    /*
      Diagnóstico fica escondido por padrão.
      Para mostrar, abra a página com ?debug=1 no final do endereço.
    */
    #debug{
      display:none;
      position:fixed;
      left:8px;
      right:8px;
      top:70px;
      z-index:80;
      color:#fff;
      background:rgba(0,0,0,.78);
      padding:9px 11px;
      border-radius:10px;
      font-size:11px;
      line-height:1.4;
      white-space:pre-wrap;
      pointer-events:none;
      max-height:35vh;
      overflow:auto;
      backdrop-filter:blur(8px);
    }
  </style>
</head>

<body>
  <div id="debug">Página carregada.</div>

  <button id="retryBtn">Tentar novamente</button>
  <button id="exploreBtn">Explorar em 3D</button>
  <button id="backBtn">← Voltar ao AR</button>

  <div id="touchLayer"></div>
  <div id="status">Iniciando câmera...</div>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: yes; uiLoading: yes; uiError: yes; filterMinCF: 0.0001; filterBeta: 1000; warmupTolerance: 3; missTolerance: 5;"
    embedded
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false"
    renderer="alpha:true; antialias:true; colorManagement:true; physicallyCorrectLights:true">

    <a-entity light="type:ambient; intensity:1.55; color:#ffffff"></a-entity>
    <a-entity light="type:directional; intensity:1.35; color:#ffe8c2" position="-2 4 3"></a-entity>

    <!-- AR: estrutura simples e igual ao que já funcionava -->
    <a-entity id="target" mindar-image-target="targetIndex:0">
      <a-entity id="arHolder">
        <a-entity id="arShadow"
          geometry="primitive: circle; radius: 0.55; segments: 32"
          material="shader: flat; transparent: true; opacity: 0.55; depthWrite: false"
          rotation="-90 0 0"
          position="0 -0.001 0"></a-entity>
        <a-entity id="arModel"></a-entity>
      </a-entity>
    </a-entity>

    <!-- Explorar 3D: modelo separado do alvo -->
    <a-entity id="exploreRoot" visible="false" position="0 0 -3">
      <a-entity id="exploreHolder">
        <a-entity id="exploreModel"></a-entity>
      </a-entity>
    </a-entity>

    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
  </a-scene>

<script>
const MODEL_PATH = "./Casa_da_bruxa_web.glb";

const scene = document.getElementById("scene");
const target = document.getElementById("target");

const arModel = document.getElementById("arModel");
const arHolder = document.getElementById("arHolder");

const exploreRoot = document.getElementById("exploreRoot");
const exploreModel = document.getElementById("exploreModel");
const exploreHolder = document.getElementById("exploreHolder");

const statusEl = document.getElementById("status");
const debugEl = document.getElementById("debug");

const exploreBtn = document.getElementById("exploreBtn");
const backBtn = document.getElementById("backBtn");
const retryBtn = document.getElementById("retryBtn");
const touchLayer = document.getElementById("touchLayer");

const DEBUG = new URLSearchParams(location.search).get("debug") === "1";
if(DEBUG) debugEl.style.display = "block";

let modelReady = false;
let modelLoading = false;
let targetSeen = false;
let exploreMode = false;

let blobUrl = null;
let controller = null;

let exploreBaseScale = 1;
let arFinalScale = 1;
let zoomMultiplier = 1;
let rotX = 0;
let rotY = 0;

let idleTime = 0;
let poppedIn = false;

const arShadow = document.getElementById("arShadow");
const GLB_CACHE_NAME = "bosque-bruxa-glb-v1";

// Touch
let lastTouchX = 0;
let lastTouchY = 0;
let pinchStartDistance = 0;
let pinchStartZoom = 1;

// Mouse (teste no PC)
let mouseDragging = false;
let lastMouseX = 0;
let lastMouseY = 0;

function log(msg){
  console.log(msg);
  if(DEBUG){
    debugEl.textContent += "\n" + msg;
    debugEl.scrollTop = debugEl.scrollHeight;
  }
}

function setStatus(msg){
  statusEl.textContent = msg;
}

function humanMB(bytes){
  return (bytes / 1024 / 1024).toFixed(2) + " MB";
}

function setupShadowTexture(){
  const size = 256;
  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;

  const ctx = canvas.getContext("2d");
  const gradient = ctx.createRadialGradient(
    size/2, size/2, 0,
    size/2, size/2, size/2
  );

  gradient.addColorStop(0, "rgba(0,0,0,0.55)");
  gradient.addColorStop(0.6, "rgba(0,0,0,0.25)");
  gradient.addColorStop(1, "rgba(0,0,0,0)");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, size, size);

  arShadow.setAttribute("material", "src", canvas.toDataURL());
}
setupShadowTexture();

function forceVideoVisible(){
  document.querySelectorAll("video").forEach(video=>{
    video.setAttribute("playsinline","");
    video.setAttribute("autoplay","");
    video.muted = true;

    Object.assign(video.style,{
      position:"fixed",
      inset:"0",
      width:"100vw",
      height:"100vh",
      objectFit:"cover",
      zIndex:"0",
      opacity:"1",
      visibility:"visible",
      display:"block"
    });

    if(video.paused){
      video.play().catch(()=>{});
    }
  });
}

setInterval(forceVideoVisible,600);

async function loadModel(){
  if(modelLoading || modelReady) return;

  modelLoading = true;
  retryBtn.style.display = "none";

  if(controller){
    try{ controller.abort(); }catch(e){}
  }

  controller = new AbortController();
  const timeout = setTimeout(()=>controller.abort(),90000);

  const cacheUrl = MODEL_PATH;
  const networkUrl = MODEL_PATH + "?v=" + Date.now();

  try{
    let response = null;
    let fromCache = false;

    if("caches" in window){
      try{
        const cache = await caches.open(GLB_CACHE_NAME);
        const cached = await cache.match(cacheUrl);
        if(cached){
          response = cached;
          fromCache = true;
          log("GLB: encontrado no cache local");
        }
      }catch(e){
        log("Cache indisponível: " + e.message);
      }
    }

    if(!response){
      log("GLB: iniciando download");
      setStatus("Baixando cenário 3D...");

      response = await fetch(networkUrl,{
        cache:"no-store",
        signal:controller.signal
      });

      log("GLB HTTP: " + response.status);

      if(!response.ok){
        throw new Error("HTTP " + response.status);
      }

      if("caches" in window){
        try{
          const cache = await caches.open(GLB_CACHE_NAME);
          await cache.put(cacheUrl, response.clone());
          log("GLB: salvo no cache local");
        }catch(e){
          log("Não foi possível salvar no cache: " + e.message);
        }
      }
    }else{
      setStatus("Carregando cenário salvo...");
    }

    const total = Number(response.headers.get("content-length")) || 0;
    if(total) log("GLB tamanho: " + humanMB(total));

    const reader = response.body.getReader();
    const chunks = [];
    let received = 0;
    let lastUI = 0;

    while(true){
      const {done,value} = await reader.read();
      if(done) break;

      chunks.push(value);
      received += value.byteLength;

      const now = performance.now();
      if(now - lastUI > 250){
        lastUI = now;

        if(total){
          const pct = Math.min(100,(received / total) * 100);
          setStatus("Baixando cenário: " + pct.toFixed(0) + "%");
        }else{
          setStatus("Baixando cenário: " + humanMB(received));
        }
      }
    }

    clearTimeout(timeout);

    log("GLB recebido: " + humanMB(received));

    const blob = new Blob(chunks,{type:"model/gltf-binary"});

    if(blob.size < 1000){
      throw new Error("Arquivo GLB inválido ou vazio");
    }

    if(blobUrl){
      URL.revokeObjectURL(blobUrl);
    }

    blobUrl = URL.createObjectURL(blob);

    setStatus("Montando cenário 3D...");

    arModel.setAttribute("gltf-model",blobUrl);
    exploreModel.setAttribute("gltf-model",blobUrl);

  }catch(err){
    clearTimeout(timeout);

    modelLoading = false;

    log("ERRO GLB: " + err.name + " - " + err.message);

    if(err.name === "AbortError"){
      setStatus("Tempo esgotado ao baixar o cenário.");
    }else{
      setStatus("Erro ao abrir o cenário 3D.");
    }

    retryBtn.style.display = "block";
  }
}

function fitModel(el,holder,desiredSize,label){
  const mesh = el.getObject3D("mesh");
  if(!mesh) return false;

  mesh.updateMatrixWorld(true);

  const box = new THREE.Box3().setFromObject(mesh);
  const size = new THREE.Vector3();
  const center = new THREE.Vector3();

  box.getSize(size);
  box.getCenter(center);

  const maxDim = Math.max(size.x,size.y,size.z);

  log(
    label + " tamanho: " +
    size.x.toFixed(3) + " x " +
    size.y.toFixed(3) + " x " +
    size.z.toFixed(3)
  );

  if(!isFinite(maxDim) || maxDim <= 0){
    log(label + ": dimensões inválidas");
    return false;
  }

  // Centraliza o próprio modelo no holder
  el.object3D.position.set(
    -center.x,
    -center.y,
    -center.z
  );

  const s = desiredSize / maxDim;
  holder.object3D.scale.set(s,s,s);

  if(label === "AR"){
    holder.object3D.position.set(0,0.03,0);
    holder.object3D.rotation.set(
      THREE.MathUtils.degToRad(-8),
      0,
      0
    );
    arFinalScale = s;
  }else{
    holder.object3D.position.set(0,-0.12,0);
    exploreBaseScale = s;
  }

  return true;
}

function checkModelsReady(){
  const arOK = !!arModel.getObject3D("mesh");
  const exploreOK = !!exploreModel.getObject3D("mesh");

  if(!arOK || !exploreOK) return;

  fitModel(arModel,arHolder,0.85,"AR");
  fitModel(exploreModel,exploreHolder,2.0,"EXPLORE");

  modelReady = true;
  modelLoading = false;

  log("GLB pronto");

  if(targetSeen){
    setStatus("Bosque encontrado!");
    exploreBtn.style.display = "block";
  }else{
    setStatus("Cenário pronto. Aponte para a imagem.");
  }
}

arModel.addEventListener("model-loaded",()=>{
  log("AR model-loaded");
  setTimeout(checkModelsReady,100);
});

exploreModel.addEventListener("model-loaded",()=>{
  log("EXPLORE model-loaded");
  setTimeout(checkModelsReady,100);
});

arModel.addEventListener("model-error",()=>{
  modelLoading = false;
  setStatus("O GLB baixou, mas o 3D não abriu.");
  retryBtn.style.display = "block";
  log("AR model-error");
});

exploreModel.addEventListener("model-error",()=>{
  log("EXPLORE model-error");
});

scene.addEventListener("arReady",()=>{
  log("AR pronto");
  setStatus("Câmera pronta. Preparando cenário...");
  setTimeout(loadModel,700);
});

scene.addEventListener("arError",()=>{
  log("Erro ao iniciar AR");
  setStatus("Erro ao iniciar câmera/AR.");
});

target.addEventListener("targetFound",()=>{
  targetSeen = true;
  log("Alvo encontrado");

  if(!exploreMode){
    if(modelReady){
      setStatus("Bosque encontrado!");
      exploreBtn.style.display = "block";

      if(!poppedIn){
        poppedIn = true;
        arHolder.object3D.scale.set(0.001,0.001,0.001);
        arHolder.setAttribute("animation__pop",{
          property:"scale",
          from: "0.001 0.001 0.001",
          to: arFinalScale + " " + arFinalScale + " " + arFinalScale,
          dur: 550,
          easing: "easeOutElastic"
        });
      }
    }else{
      setStatus("Imagem encontrada. Cenário carregando...");
    }
  }
});

target.addEventListener("targetLost",()=>{
  targetSeen = false;
  log("Alvo perdido");

  if(!exploreMode){
    exploreBtn.style.display = "none";

    if(modelReady){
      setStatus("Aponte novamente para a imagem.");
    }
  }
});

retryBtn.addEventListener("click",()=>{
  retryBtn.style.display = "none";
  loadModel();
});

exploreBtn.addEventListener("click",()=>{
  if(!modelReady) return;

  exploreMode = true;

  // Esconde o AR e mostra o modelo livre
  target.setAttribute("visible",false);
  exploreRoot.setAttribute("visible",true);

  touchLayer.style.display = "block";
  exploreBtn.style.display = "none";
  backBtn.style.display = "block";

  setStatus("1 dedo gira • 2 dedos dão zoom");
});

backBtn.addEventListener("click",()=>{
  exploreMode = false;

  touchLayer.style.display = "none";
  exploreRoot.setAttribute("visible",false);
  target.setAttribute("visible",true);

  backBtn.style.display = "none";

  if(targetSeen && modelReady){
    exploreBtn.style.display = "block";
    setStatus("Bosque encontrado!");
  }else{
    exploreBtn.style.display = "none";
    setStatus("Aponte para a imagem.");
  }
});

function applyExploreTransform(){
  exploreHolder.object3D.rotation.set(
    THREE.MathUtils.degToRad(rotX),
    THREE.MathUtils.degToRad(rotY),
    0
  );

  const s = exploreBaseScale * zoomMultiplier;
  exploreHolder.object3D.scale.set(s,s,s);
}

/* ============================
   CONTROLE TOUCH - SOMENTE AQUI
   ============================ */

touchLayer.addEventListener("touchstart",event=>{
  if(!exploreMode) return;

  event.preventDefault();

  if(event.touches.length === 1){
    lastTouchX = event.touches[0].clientX;
    lastTouchY = event.touches[0].clientY;
  }

  if(event.touches.length === 2){
    const a = event.touches[0];
    const b = event.touches[1];

    pinchStartDistance = Math.hypot(
      b.clientX - a.clientX,
      b.clientY - a.clientY
    );

    pinchStartZoom = zoomMultiplier;
  }
},{passive:false});

touchLayer.addEventListener("touchmove",event=>{
  if(!exploreMode) return;

  event.preventDefault();

  // Um dedo = girar
  if(event.touches.length === 1){
    const t = event.touches[0];

    const dx = t.clientX - lastTouchX;
    const dy = t.clientY - lastTouchY;

    rotY += dx * 0.45;
    rotX += dy * 0.25;

    rotX = Math.max(-60,Math.min(60,rotX));

    lastTouchX = t.clientX;
    lastTouchY = t.clientY;

    applyExploreTransform();
  }

  // Dois dedos = zoom
  if(event.touches.length === 2){
    const a = event.touches[0];
    const b = event.touches[1];

    const currentDistance = Math.hypot(
      b.clientX - a.clientX,
      b.clientY - a.clientY
    );

    if(pinchStartDistance > 0){
      zoomMultiplier =
        pinchStartZoom * (currentDistance / pinchStartDistance);

      zoomMultiplier = Math.max(
        0.25,
        Math.min(5,zoomMultiplier)
      );

      applyExploreTransform();
    }
  }
},{passive:false});

touchLayer.addEventListener("touchend",event=>{
  if(event.touches.length === 1){
    lastTouchX = event.touches[0].clientX;
    lastTouchY = event.touches[0].clientY;
  }

  if(event.touches.length < 2){
    pinchStartDistance = 0;
    pinchStartZoom = zoomMultiplier;
  }
},{passive:false});

touchLayer.addEventListener("touchcancel",()=>{
  pinchStartDistance = 0;
  pinchStartZoom = zoomMultiplier;
},{passive:false});

/* ============================
   MOUSE - TESTE NO COMPUTADOR
   ============================ */

touchLayer.addEventListener("mousedown",event=>{
  if(!exploreMode) return;

  mouseDragging = true;
  lastMouseX = event.clientX;
  lastMouseY = event.clientY;
});

window.addEventListener("mousemove",event=>{
  if(!exploreMode || !mouseDragging) return;

  const dx = event.clientX - lastMouseX;
  const dy = event.clientY - lastMouseY;

  rotY += dx * 0.45;
  rotX += dy * 0.25;
  rotX = Math.max(-60,Math.min(60,rotX));

  lastMouseX = event.clientX;
  lastMouseY = event.clientY;

  applyExploreTransform();
});

window.addEventListener("mouseup",()=>{
  mouseDragging = false;
});

/* ============================
   FLUTUAÇÃO SUTIL (idle bob)
   ============================ */

function idleLoop(){
  requestAnimationFrame(idleLoop);

  if(!modelReady || exploreMode || !targetSeen) return;

  idleTime += 0.016;
  const bob = Math.sin(idleTime * 1.4) * 0.012;
  arHolder.object3D.position.y = 0.03 + bob;
}
requestAnimationFrame(idleLoop);

touchLayer.addEventListener("wheel",event=>{
  if(!exploreMode) return;

  event.preventDefault();

  const factor = event.deltaY < 0 ? 1.08 : 0.92;

  zoomMultiplier *= factor;
  zoomMultiplier = Math.max(
    0.25,
    Math.min(5,zoomMultiplier)
  );

  applyExploreTransform();
},{passive:false});

</script>
</body>
</html>
