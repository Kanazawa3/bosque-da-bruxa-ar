<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Bosque da Bruxa AR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#000;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    }

    video{
      position:fixed !important;
      inset:0 !important;
      width:100vw !important;
      height:100vh !important;
      object-fit:cover !important;
      z-index:0 !important;
      opacity:1 !important;
      visibility:visible !important;
      display:block !important;
      background:#000;
    }

    a-scene,.a-canvas{
      position:fixed !important;
      inset:0 !important;
      width:100vw !important;
      height:100vh !important;
      z-index:2 !important;
      background:transparent !important;
    }

    .mindar-ui-overlay{
      z-index:5 !important;
    }

    #status{
      position:fixed;
      left:50%;
      top:50%;
      bottom:auto;
      transform:translate(-50%,-50%);
      z-index:70;
      color:#fff;
      background:rgba(0,0,0,.76);
      padding:16px 20px;
      border-radius:16px;
      font-size:20px;
      font-weight:700;
      line-height:1.35;
      text-align:center;
      white-space:normal;
      backdrop-filter:blur(8px);
      pointer-events:none;
      width:min(86vw,420px);
      box-sizing:border-box;
    }

    #status.camera-ready{
      top:auto;
      bottom:18px;
      transform:translateX(-50%);
      width:auto;
      max-width:88vw;
      padding:10px 14px;
      border-radius:999px;
      font-size:14px;
      font-weight:600;
      white-space:nowrap;
    }

    #zoomControls{
      position:fixed;
      right:16px;
      bottom:24px;
      z-index:80;
      display:none;
      flex-direction:column;
      gap:10px;
    }

    #zoomControls button{
      width:52px;
      height:52px;
      border:0;
      border-radius:50%;
      background:rgba(255,255,255,.94);
      color:#111;
      font-size:30px;
      font-weight:700;
      line-height:1;
      box-shadow:0 3px 12px rgba(0,0,0,.28);
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }

    #exploreBtn,#backBtn,#retryBtn{
      position:fixed;
      top:16px;
      z-index:60;
      border:0;
      border-radius:999px;
      padding:11px 15px;
      font-weight:700;
      font-size:14px;
      display:none;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }

    #exploreBtn,#retryBtn{
      right:14px;
      background:#fff;
      color:#111;
    }

    #retryBtn{
      background:#ffdf6c;
    }

    #backBtn{
      left:14px;
      background:rgba(0,0,0,.78);
      color:#fff;
    }

    /*
      Esta camada só existe no modo Explorar.
      Assim o giro/zoom não interfere com o AR nem com os botões.
    */
    #touchLayer{
      position:fixed;
      inset:0;
      z-index:30;
      display:none;
      touch-action:none;
      background:transparent;
    }

    /*
      Diagnóstico fica escondido por padrão.
      Para mostrar, abra a página com ?debug=1 no final do endereço.
    */
    #debug{
      display:none;
      position:fixed;
      left:8px;
      right:8px;
      top:70px;
      z-index:80;
      color:#fff;
      background:rgba(0,0,0,.78);
      padding:9px 11px;
      border-radius:10px;
      font-size:11px;
      line-height:1.4;
      white-space:pre-wrap;
      pointer-events:none;
      max-height:35vh;
      overflow:auto;
      backdrop-filter:blur(8px);
    }
  </style>
</head>

<body>
  <div id="debug">Página carregada.</div>

  <button id="retryBtn">Tentar novamente</button>

  <div id="zoomControls">
    <button id="zoomInBtn" aria-label="Aumentar zoom">+</button>
    <button id="zoomOutBtn" aria-label="Diminuir zoom">−</button>
  </div>

  <div id="touchLayer"></div>
  <div id="status">Preparando experiência...</div>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: yes; uiLoading: yes; uiError: yes; warmupTolerance: 3; missTolerance: 10; filterMinCF: 0.0005; filterBeta: 1000;"
    embedded
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false"
    renderer="alpha:true; antialias:true; colorManagement:true; physicallyCorrectLights:true">

    <a-entity light="type:ambient; intensity:1.55; color:#ffffff"></a-entity>
    <a-entity light="type:directional; intensity:1.35; color:#ffe8c2" position="-2 4 3"></a-entity>

    <!-- AR: estrutura simples e igual ao que já funcionava -->
    <a-entity id="target" mindar-image-target="targetIndex:0">
      <a-entity id="arHolder">
        <a-entity id="arModel"></a-entity>
      </a-entity>
    </a-entity>

    <!-- Explorar 3D: modelo separado do alvo -->
    <a-entity id="exploreRoot" visible="false" position="0 0 -3">
      <a-entity id="exploreHolder">
        <a-entity id="exploreModel"></a-entity>
      </a-entity>
    </a-entity>

    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
  </a-scene>

<script>
const MODEL_PATH = "./Casa_da_bruxa_web.glb";

const scene = document.getElementById("scene");
const target = document.getElementById("target");

const arModel = document.getElementById("arModel");
const arHolder = document.getElementById("arHolder");

const exploreRoot = document.getElementById("exploreRoot");
const exploreModel = document.getElementById("exploreModel");
const exploreHolder = document.getElementById("exploreHolder");

const statusEl = document.getElementById("status");
const debugEl = document.getElementById("debug");

const exploreBtn = null;
const backBtn = null;
const retryBtn = document.getElementById("retryBtn");
const touchLayer = document.getElementById("touchLayer");

const zoomControls = document.getElementById("zoomControls");
const zoomInBtn = document.getElementById("zoomInBtn");
const zoomOutBtn = document.getElementById("zoomOutBtn");

const DEBUG = new URLSearchParams(location.search).get("debug") === "1";
if(DEBUG) debugEl.style.display = "block";

let modelReady = false;
let modelLoading = false;
let targetSeen = false;
let exploreMode = false;
let targetLostTimer = null;
let cameraStarted = false;
let arBaseScale = 1;
let arZoomMultiplier = 1;

let blobUrl = null;
let controller = null;

let exploreBaseScale = 1;
let zoomMultiplier = 1;
let rotX = 0;
let rotY = 0;

// Touch
let lastTouchX = 0;
let lastTouchY = 0;
let pinchStartDistance = 0;
let pinchStartZoom = 1;

// Mouse (teste no PC)
let mouseDragging = false;
let lastMouseX = 0;
let lastMouseY = 0;

function log(msg){
  console.log(msg);
  if(DEBUG){
    debugEl.textContent += "\n" + msg;
    debugEl.scrollTop = debugEl.scrollHeight;
  }
}

function setStatus(msg){
  statusEl.textContent = msg;
}

function humanMB(bytes){
  return (bytes / 1024 / 1024).toFixed(2) + " MB";
}

function forceVideoVisible(){
  document.querySelectorAll("video").forEach(video=>{
    video.setAttribute("playsinline","");
    video.setAttribute("autoplay","");
    video.muted = true;

    Object.assign(video.style,{
      position:"fixed",
      inset:"0",
      width:"100vw",
      height:"100vh",
      objectFit:"cover",
      zIndex:"0",
      opacity:"1",
      visibility:"visible",
      display:"block"
    });

    if(video.paused){
      video.play().catch(()=>{});
    }
  });
}

setInterval(forceVideoVisible,600);

async function loadModel(){
  if(modelLoading || modelReady) return;

  modelLoading = true;
  retryBtn.style.display = "none";

  if(controller){
    try{ controller.abort(); }catch(e){}
  }

  controller = new AbortController();
  const timeout = setTimeout(()=>controller.abort(),90000);

  const url = MODEL_PATH + "?v=" + Date.now();

  try{
    log("GLB: iniciando download");
    setStatus("Baixando cenário 3D...");

    const response = await fetch(url,{
      cache:"no-store",
      signal:controller.signal
    });

    log("GLB HTTP: " + response.status);

    if(!response.ok){
      throw new Error("HTTP " + response.status);
    }

    const total = Number(response.headers.get("content-length")) || 0;
    if(total) log("GLB tamanho: " + humanMB(total));

    const reader = response.body.getReader();
    const chunks = [];
    let received = 0;
    let lastUI = 0;

    while(true){
      const {done,value} = await reader.read();
      if(done) break;

      chunks.push(value);
      received += value.byteLength;

      const now = performance.now();
      if(now - lastUI > 250){
        lastUI = now;

        if(total){
          const pct = Math.min(100,(received / total) * 100);
          setStatus("Baixando cenário: " + pct.toFixed(0) + "%");
        }else{
          setStatus("Baixando cenário: " + humanMB(received));
        }
      }
    }

    clearTimeout(timeout);

    log("GLB recebido: " + humanMB(received));

    const blob = new Blob(chunks,{type:"model/gltf-binary"});

    if(blob.size < 1000){
      throw new Error("Arquivo GLB inválido ou vazio");
    }

    if(blobUrl){
      URL.revokeObjectURL(blobUrl);
    }

    blobUrl = URL.createObjectURL(blob);

    setStatus("Montando cenário 3D...");

    arModel.setAttribute("gltf-model",blobUrl);
    exploreModel.setAttribute("gltf-model",blobUrl);

  }catch(err){
    clearTimeout(timeout);

    modelLoading = false;

    log("ERRO GLB: " + err.name + " - " + err.message);

    if(err.name === "AbortError"){
      setStatus("Tempo esgotado ao baixar o cenário.");
    }else{
      setStatus("Erro ao abrir o cenário 3D.");
    }

    retryBtn.style.display = "block";
  }
}

function fitModel(el,holder,desiredSize,label){
  const mesh = el.getObject3D("mesh");
  if(!mesh) return false;

  mesh.updateMatrixWorld(true);

  const box = new THREE.Box3().setFromObject(mesh);
  const size = new THREE.Vector3();
  const center = new THREE.Vector3();

  box.getSize(size);
  box.getCenter(center);

  const maxDim = Math.max(size.x,size.y,size.z);

  log(
    label + " tamanho: " +
    size.x.toFixed(3) + " x " +
    size.y.toFixed(3) + " x " +
    size.z.toFixed(3)
  );

  if(!isFinite(maxDim) || maxDim <= 0){
    log(label + ": dimensões inválidas");
    return false;
  }

  // Centraliza o próprio modelo no holder
  el.object3D.position.set(
    -center.x,
    -center.y,
    -center.z
  );

  const s = desiredSize / maxDim;
  holder.object3D.scale.set(s,s,s);

  if(label === "AR"){
    holder.object3D.position.set(0,0.00,0);
    holder.object3D.rotation.set(
      THREE.MathUtils.degToRad(-8),
      0,
      0
    );
    arBaseScale = s;
  }else{
    holder.object3D.position.set(0,-0.12,0);
    exploreBaseScale = s;
  }

  return true;
}

function checkModelsReady(){
  const arOK = !!arModel.getObject3D("mesh");
  const exploreOK = !!exploreModel.getObject3D("mesh");

  if(!arOK || !exploreOK) return;

  fitModel(arModel,arHolder,0.72,"AR");
  fitModel(exploreModel,exploreHolder,2.0,"EXPLORE");

  modelReady = true;
  modelLoading = false;

  log("GLB pronto");

  if(targetSeen && arModel.getObject3D("mesh")){
    arHolder.object3D.visible = true;
    setStatus("Bosque encontrado!");
  }else{
    arHolder.object3D.visible = false;
    setStatus("Cenário pronto. Abrindo câmera...");
  }

  if(!cameraStarted){
    cameraStarted = true;

    setTimeout(async ()=>{
      try{
        const mindarSystem = scene.systems["mindar-image-system"];

        if(mindarSystem && typeof mindarSystem.start === "function"){
          await mindarSystem.start();
        }else{
          throw new Error("Sistema MindAR não disponível");
        }
      }catch(err){
        cameraStarted = false;
        log("Erro ao iniciar câmera: " + err.message);
        setStatus("Erro ao iniciar câmera.");
        retryBtn.style.display = "block";
      }
    },250);
  }
}

arModel.addEventListener("model-loaded",()=>{
  log("AR model-loaded");
  setTimeout(checkModelsReady,100);
});

exploreModel.addEventListener("model-loaded",()=>{
  log("EXPLORE model-loaded");
  setTimeout(checkModelsReady,100);
});

arModel.addEventListener("model-error",()=>{
  modelLoading = false;
  setStatus("O GLB baixou, mas o 3D não abriu.");
  retryBtn.style.display = "block";
  log("AR model-error");
});

exploreModel.addEventListener("model-error",()=>{
  log("EXPLORE model-error");
});

scene.addEventListener("arReady",()=>{
  log("AR pronto");
  statusEl.classList.add("camera-ready");

  if(targetSeen && modelReady && arModel.getObject3D("mesh")){
    arHolder.object3D.visible = true;
    setStatus("Bosque encontrado!");
  }else{
    setStatus("Agora aponte a câmera para a imagem.");
  }

  zoomControls.style.display = "flex";
});

scene.addEventListener("arError",()=>{
  log("Erro ao iniciar AR");
  setStatus("Erro ao iniciar câmera/AR.");
});

scene.addEventListener("loaded",()=>{
  setStatus("Baixando cenário 3D...");
  setTimeout(loadModel,150);
});

target.addEventListener("targetFound",()=>{
  targetSeen = true;
  log("Alvo encontrado");

  if(targetLostTimer){
    clearTimeout(targetLostTimer);
    targetLostTimer = null;
  }

  if(!exploreMode){
    if(modelReady && arModel.getObject3D("mesh")){
      arHolder.object3D.visible = true;
      setStatus("Bosque encontrado!");
    }else{
      arHolder.object3D.visible = false;
      setStatus("Imagem encontrada. Preparando cenário...");
    }
  }
});

target.addEventListener("targetLost",()=>{
  log("Alvo perdido");

  if(targetLostTimer){
    clearTimeout(targetLostTimer);
  }

  targetLostTimer = setTimeout(()=>{
    targetSeen = false;

    if(!exploreMode){
      arHolder.object3D.visible = false;

      if(modelReady){
        setStatus("Aponte novamente para a imagem.");
      }
    }

    targetLostTimer = null;
  },250);
});

retryBtn.addEventListener("click",async ()=>{
  retryBtn.style.display = "none";

  if(modelReady && !cameraStarted){
    try{
      cameraStarted = true;
      const mindarSystem = scene.systems["mindar-image-system"];
      await mindarSystem.start();
    }catch(err){
      cameraStarted = false;
      setStatus("Erro ao iniciar câmera.");
      retryBtn.style.display = "block";
    }
  }else if(!modelReady){
    loadModel();
  }
});

function applyARZoom(){
  const s = arBaseScale * arZoomMultiplier;
  arHolder.object3D.scale.set(s,s,s);
}

function changeARZoom(factor){
  if(!modelReady) return;

  arZoomMultiplier *= factor;
  arZoomMultiplier = Math.max(0.45,Math.min(2.5,arZoomMultiplier));
  applyARZoom();
}

zoomInBtn.addEventListener("click",()=>{
  changeARZoom(1.15);
});

zoomOutBtn.addEventListener("click",()=>{
  changeARZoom(1 / 1.15);
});

function applyExploreTransform(){
  exploreHolder.object3D.rotation.set(
    THREE.MathUtils.degToRad(rotX),
    THREE.MathUtils.degToRad(rotY),
    0
  );

  const s = exploreBaseScale * zoomMultiplier;
  exploreHolder.object3D.scale.set(s,s,s);
}

/* ============================
   CONTROLE TOUCH - SOMENTE AQUI
   ============================ */

touchLayer.addEventListener("touchstart",event=>{
  if(!exploreMode) return;

  event.preventDefault();

  if(event.touches.length === 1){
    lastTouchX = event.touches[0].clientX;
    lastTouchY = event.touches[0].clientY;
  }

  if(event.touches.length === 2){
    const a = event.touches[0];
    const b = event.touches[1];

    pinchStartDistance = Math.hypot(
      b.clientX - a.clientX,
      b.clientY - a.clientY
    );

    pinchStartZoom = zoomMultiplier;
  }
},{passive:false});

touchLayer.addEventListener("touchmove",event=>{
  if(!exploreMode) return;

  event.preventDefault();

  // Um dedo = girar
  if(event.touches.length === 1){
    const t = event.touches[0];

    const dx = t.clientX - lastTouchX;
    const dy = t.clientY - lastTouchY;

    rotY += dx * 0.45;
    rotX += dy * 0.25;

    rotX = Math.max(-60,Math.min(60,rotX));

    lastTouchX = t.clientX;
    lastTouchY = t.clientY;

    applyExploreTransform();
  }

  // Dois dedos = zoom
  if(event.touches.length === 2){
    const a = event.touches[0];
    const b = event.touches[1];

    const currentDistance = Math.hypot(
      b.clientX - a.clientX,
      b.clientY - a.clientY
    );

    if(pinchStartDistance > 0){
      zoomMultiplier =
        pinchStartZoom * (currentDistance / pinchStartDistance);

      zoomMultiplier = Math.max(
        0.25,
        Math.min(5,zoomMultiplier)
      );

      applyExploreTransform();
    }
  }
},{passive:false});

touchLayer.addEventListener("touchend",event=>{
  if(event.touches.length === 1){
    lastTouchX = event.touches[0].clientX;
    lastTouchY = event.touches[0].clientY;
  }

  if(event.touches.length < 2){
    pinchStartDistance = 0;
    pinchStartZoom = zoomMultiplier;
  }
},{passive:false});

touchLayer.addEventListener("touchcancel",()=>{
  pinchStartDistance = 0;
  pinchStartZoom = zoomMultiplier;
},{passive:false});

/* ============================
   MOUSE - TESTE NO COMPUTADOR
   ============================ */

touchLayer.addEventListener("mousedown",event=>{
  if(!exploreMode) return;

  mouseDragging = true;
  lastMouseX = event.clientX;
  lastMouseY = event.clientY;
});

window.addEventListener("mousemove",event=>{
  if(!exploreMode || !mouseDragging) return;

  const dx = event.clientX - lastMouseX;
  const dy = event.clientY - lastMouseY;

  rotY += dx * 0.45;
  rotX += dy * 0.25;
  rotX = Math.max(-60,Math.min(60,rotX));

  lastMouseX = event.clientX;
  lastMouseY = event.clientY;

  applyExploreTransform();
});

window.addEventListener("mouseup",()=>{
  mouseDragging = false;
});

touchLayer.addEventListener("wheel",event=>{
  if(!exploreMode) return;

  event.preventDefault();

  const factor = event.deltaY < 0 ? 1.08 : 0.92;

  zoomMultiplier *= factor;
  zoomMultiplier = Math.max(
    0.25,
    Math.min(5,zoomMultiplier)
  );

  applyExploreTransform();
},{passive:false});

</script>
</body>
</html>
