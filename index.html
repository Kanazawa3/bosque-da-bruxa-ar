<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Bosque da Bruxa AR</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    video{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;object-fit:cover!important;z-index:0!important;opacity:1!important;visibility:visible!important;display:block!important;background:#000}
    a-scene,.a-canvas{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;z-index:2!important;background:transparent!important}
    .mindar-ui-overlay{z-index:5!important}
    #status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:80;width:min(86vw,420px);box-sizing:border-box;color:#fff;background:rgba(0,0,0,.76);padding:16px 20px;border-radius:16px;font-size:20px;font-weight:700;line-height:1.35;text-align:center;pointer-events:none;backdrop-filter:blur(8px)}
    #status.ready{top:auto;bottom:18px;transform:translateX(-50%);width:auto;max-width:88vw;padding:10px 14px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap}
    #exitBtn,#retryBtn{position:fixed;top:16px;z-index:95;border:0;border-radius:999px;padding:11px 15px;font-weight:700;font-size:14px;display:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    #exitBtn{left:14px;background:rgba(0,0,0,.78);color:#fff}
    #retryBtn{right:14px;background:#ffdf6c;color:#111}
    #zoomControls{position:fixed;right:16px;bottom:24px;z-index:95;display:none;flex-direction:column;gap:10px}
    #zoomControls button{width:54px;height:54px;border:0;border-radius:50%;background:rgba(255,255,255,.95);color:#111;font-size:30px;font-weight:700;line-height:1;box-shadow:0 3px 12px rgba(0,0,0,.28);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    #touchLayer{position:fixed;inset:0;z-index:30;display:none;touch-action:none;background:transparent}
    #debug{display:none;position:fixed;left:8px;right:8px;top:70px;z-index:110;color:#fff;background:rgba(0,0,0,.82);padding:9px 11px;border-radius:10px;font-size:11px;line-height:1.4;white-space:pre-wrap;pointer-events:none;max-height:38vh;overflow:auto;backdrop-filter:blur(8px)}
  </style>
</head>
<body>
  <div id="debug">Página carregada.</div>
  <button id="exitBtn">Sair</button>
  <button id="retryBtn">Tentar novamente</button>
  <div id="zoomControls">
    <button id="zoomInBtn" aria-label="Aumentar zoom">+</button>
    <button id="zoomOutBtn" aria-label="Diminuir zoom">−</button>
  </div>
  <div id="touchLayer"></div>
  <div id="status">Preparando experiência...</div>

  <a-scene id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: yes; uiLoading: yes; uiError: yes; warmupTolerance: 3; missTolerance: 10; filterMinCF: 0.0005; filterBeta: 1000;"
    embedded
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false"
    renderer="alpha:true; antialias:true; colorManagement:true; physicallyCorrectLights:true">

    <a-entity light="type:ambient; intensity:1.85; color:#ffffff"></a-entity>
    <a-entity light="type:directional; intensity:1.45; color:#fff1dc" position="-2 4 3"></a-entity>

    <a-entity id="preloadModel" visible="false"></a-entity>
    <a-entity id="target" mindar-image-target="targetIndex:0"></a-entity>

    <a-camera id="camera" position="0 0 0" look-controls="enabled:false">
      <a-entity id="fixedRoot" visible="false" position="0 0 -3">
        <a-entity id="fixedHolder">
          <a-entity id="fixedModel"></a-entity>
        </a-entity>
      </a-entity>
    </a-camera>
  </a-scene>

<script>
const MODEL_PATH="./Casa_da_bruxa_web.glb";

const scene=document.getElementById("scene");
const target=document.getElementById("target");
const preloadModel=document.getElementById("preloadModel");
const fixedRoot=document.getElementById("fixedRoot");
const fixedHolder=document.getElementById("fixedHolder");
const fixedModel=document.getElementById("fixedModel");
const statusEl=document.getElementById("status");
const debugEl=document.getElementById("debug");
const exitBtn=document.getElementById("exitBtn");
const retryBtn=document.getElementById("retryBtn");
const zoomControls=document.getElementById("zoomControls");
const zoomInBtn=document.getElementById("zoomInBtn");
const zoomOutBtn=document.getElementById("zoomOutBtn");
const touchLayer=document.getElementById("touchLayer");

const DEBUG=new URLSearchParams(location.search).get("debug")==="1";
if(DEBUG) debugEl.style.display="block";

let modelReady=false,modelLoading=false,cameraStarted=false,targetSeen=false,dioramaOpen=false;
let waitingForRearm=false,targetLostTimer=null,openTimer=null;
let baseScale=1,zoomMultiplier=1,rotX=-6,rotY=0;
let lastTouchX=0,lastTouchY=0;
let mouseDragging=false,lastMouseX=0,lastMouseY=0;

function log(msg){
  console.log(msg);
  if(DEBUG){
    debugEl.textContent+="\n"+msg;
    debugEl.scrollTop=debugEl.scrollHeight;
  }
}
function setStatus(msg){statusEl.textContent=msg}
function forceVideoVisible(){
  document.querySelectorAll("video").forEach(video=>{
    video.setAttribute("playsinline","");
    video.setAttribute("autoplay","");
    video.muted=true;
    Object.assign(video.style,{position:"fixed",inset:"0",width:"100vw",height:"100vh",objectFit:"cover",zIndex:"0",opacity:"1",visibility:"visible",display:"block"});
    if(video.paused) video.play().catch(()=>{});
  });
}
setInterval(forceVideoVisible,700);

function applyDioramaTransform(){
  fixedHolder.object3D.rotation.set(
    THREE.MathUtils.degToRad(rotX),
    THREE.MathUtils.degToRad(rotY),
    0
  );
  const s=baseScale*zoomMultiplier;
  fixedHolder.object3D.scale.set(s,s,s);
}

function prepareDioramaFromLoadedModel(){
  const source=preloadModel.getObject3D("mesh");
  if(!source) throw new Error("Mesh do GLB não encontrado.");

  const clone=source.clone(true);
  fixedModel.removeObject3D("mesh");
  fixedModel.setObject3D("mesh",clone);
  clone.updateMatrixWorld(true);

  const box=new THREE.Box3().setFromObject(clone);
  const size=new THREE.Vector3();
  const center=new THREE.Vector3();
  box.getSize(size);
  box.getCenter(center);

  const maxDim=Math.max(size.x,size.y,size.z);
  if(!isFinite(maxDim)||maxDim<=0) throw new Error("Dimensões inválidas do GLB.");

  fixedModel.object3D.position.set(-center.x,-center.y,-center.z);

  baseScale=1.55/maxDim;
  zoomMultiplier=1;
  rotX=-6;
  rotY=0;
  fixedHolder.object3D.position.set(0,-0.08,0);
  applyDioramaTransform();

  log("Diorama preparado.");
}

function loadModel(){
  if(modelLoading||modelReady) return;
  modelLoading=true;
  retryBtn.style.display="none";
  setStatus("Baixando cenário 3D...");

  const url=MODEL_PATH+"?v="+Date.now();
  preloadModel.removeAttribute("gltf-model");
  setTimeout(()=>preloadModel.setAttribute("gltf-model",url),50);
}

async function startCamera(){
  if(cameraStarted) return;
  try{
    cameraStarted=true;
    setStatus("Cenário pronto. Abrindo câmera...");
    const mindarSystem=scene.systems["mindar-image-system"];
    if(!mindarSystem||typeof mindarSystem.start!=="function") throw new Error("Sistema MindAR indisponível.");
    await mindarSystem.start();
  }catch(err){
    cameraStarted=false;
    log("Erro ao abrir câmera: "+err.message);
    setStatus("Erro ao iniciar câmera.");
    retryBtn.style.display="block";
  }
}

preloadModel.addEventListener("model-loaded",async()=>{
  try{
    prepareDioramaFromLoadedModel();
    modelReady=true;
    modelLoading=false;
    await startCamera();
  }catch(err){
    modelReady=false;
    modelLoading=false;
    log("Erro ao preparar GLB: "+err.message);
    setStatus("Erro ao preparar o cenário 3D.");
    retryBtn.style.display="block";
  }
});

preloadModel.addEventListener("model-error",event=>{
  modelReady=false;
  modelLoading=false;
  console.error(event);
  setStatus("Erro ao abrir o cenário 3D.");
  retryBtn.style.display="block";
});

scene.addEventListener("loaded",()=>setTimeout(loadModel,150));

scene.addEventListener("arReady",()=>{
  statusEl.classList.add("ready");
  setStatus("Agora aponte a câmera para a imagem.");
  forceVideoVisible();
  log("Câmera pronta.");
});

scene.addEventListener("arError",()=>{
  cameraStarted=false;
  setStatus("Erro ao iniciar câmera/AR.");
  retryBtn.style.display="block";
});

function openDiorama(){
  if(!modelReady||dioramaOpen||waitingForRearm) return;

  dioramaOpen=true;
  fixedRoot.setAttribute("visible",true);
  fixedRoot.object3D.visible=true;

  zoomMultiplier=1;
  rotX=-6;
  rotY=0;
  applyDioramaTransform();

  touchLayer.style.display="block";
  zoomControls.style.display="flex";
  exitBtn.style.display="block";

  setStatus("Diorama pronto • 1 dedo gira • use − / + para zoom");
}

function closeDiorama(){
  if(!dioramaOpen) return;

  dioramaOpen=false;
  waitingForRearm=true;

  if(openTimer){clearTimeout(openTimer);openTimer=null}

  touchLayer.style.display="none";
  zoomControls.style.display="none";
  exitBtn.style.display="none";

  fixedRoot.setAttribute("visible",false);
  fixedRoot.object3D.visible=false;

  setStatus("Afaste a câmera e aponte novamente para a imagem.");
}

target.addEventListener("targetFound",()=>{
  targetSeen=true;

  if(targetLostTimer){
    clearTimeout(targetLostTimer);
    targetLostTimer=null;
  }

  if(waitingForRearm||dioramaOpen) return;

  setStatus("Imagem reconhecida. Abrindo diorama...");

  if(openTimer) clearTimeout(openTimer);
  openTimer=setTimeout(()=>{
    if(targetSeen&&!waitingForRearm&&!dioramaOpen) openDiorama();
  },350);
});

target.addEventListener("targetLost",()=>{
  if(targetLostTimer) clearTimeout(targetLostTimer);

  targetLostTimer=setTimeout(()=>{
    targetSeen=false;

    if(openTimer){
      clearTimeout(openTimer);
      openTimer=null;
    }

    if(waitingForRearm){
      waitingForRearm=false;
      setStatus("Agora aponte novamente para a imagem.");
    }

    targetLostTimer=null;
  },250);
});

function changeZoom(factor){
  if(!dioramaOpen) return;
  zoomMultiplier*=factor;
  zoomMultiplier=Math.max(0.35,Math.min(4.0,zoomMultiplier));
  applyDioramaTransform();
}

zoomInBtn.addEventListener("click",()=>changeZoom(1.15));
zoomOutBtn.addEventListener("click",()=>changeZoom(1/1.15));
exitBtn.addEventListener("click",closeDiorama);

touchLayer.addEventListener("touchstart",event=>{
  if(!dioramaOpen||event.touches.length!==1) return;
  event.preventDefault();
  lastTouchX=event.touches[0].clientX;
  lastTouchY=event.touches[0].clientY;
},{passive:false});

touchLayer.addEventListener("touchmove",event=>{
  if(!dioramaOpen||event.touches.length!==1) return;
  event.preventDefault();

  const touch=event.touches[0];
  const dx=touch.clientX-lastTouchX;
  const dy=touch.clientY-lastTouchY;

  rotY+=dx*0.45;
  rotX+=dy*0.22;
  rotX=Math.max(-60,Math.min(60,rotX));

  lastTouchX=touch.clientX;
  lastTouchY=touch.clientY;

  applyDioramaTransform();
},{passive:false});

touchLayer.addEventListener("mousedown",event=>{
  if(!dioramaOpen) return;
  mouseDragging=true;
  lastMouseX=event.clientX;
  lastMouseY=event.clientY;
});

window.addEventListener("mousemove",event=>{
  if(!dioramaOpen||!mouseDragging) return;

  const dx=event.clientX-lastMouseX;
  const dy=event.clientY-lastMouseY;

  rotY+=dx*0.45;
  rotX+=dy*0.22;
  rotX=Math.max(-60,Math.min(60,rotX));

  lastMouseX=event.clientX;
  lastMouseY=event.clientY;
  applyDioramaTransform();
});

window.addEventListener("mouseup",()=>{mouseDragging=false});

touchLayer.addEventListener("wheel",event=>{
  if(!dioramaOpen) return;
  event.preventDefault();
  changeZoom(event.deltaY<0?1.10:0.90);
},{passive:false});

retryBtn.addEventListener("click",async()=>{
  retryBtn.style.display="none";
  if(!modelReady){
    modelLoading=false;
    loadModel();
    return;
  }
  if(!cameraStarted) await startCamera();
});

document.addEventListener("visibilitychange",()=>{
  if(!document.hidden) setTimeout(forceVideoVisible,200);
});

window.addEventListener("error",event=>log("JS ERRO: "+event.message));
window.addEventListener("unhandledrejection",event=>log("PROMISE ERRO: "+String(event.reason)));
</script>
</body>
</html>
