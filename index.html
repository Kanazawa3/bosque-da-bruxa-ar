<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bosque da Bruxa 2.5D v2</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08050e;font-family:system-ui,sans-serif}
#stage{
 position:fixed;inset:0;overflow:hidden;perspective:700px;touch-action:none;
 background:#12091d;
}
#scene{
 position:absolute;inset:-8%;
 transform-style:preserve-3d;
 transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1.03);
}
.layer{
 position:absolute;inset:0;
 background:url("bosque.png") center/100% 100% no-repeat;
 transform-style:preserve-3d;will-change:transform;
}
/* imagem-base recuada */
.base{
 transform:translate3d(calc(var(--x)*-.10),calc(var(--y)*-.06),-220px) scale(1.34);
 filter:brightness(.72) saturate(.82) blur(.3px);
}
/* céu, lua e floresta distante */
.sky{
 clip-path:polygon(5% 0,95% 0,92% 58%,8% 58%);
 transform:translate3d(calc(var(--x)*-.04),calc(var(--y)*-.03),-100px) scale(1.18);
 filter:brightness(.9);
}
/* floresta média */
.forest{
 clip-path:polygon(5% 23%,69% 20%,68% 76%,5% 79%);
 transform:translate3d(calc(var(--x)*.12),calc(var(--y)*.07),10px) scale(1.08);
}
/* casa */
.house{
 clip-path:polygon(59% 5%,91% 4%,94% 79%,53% 82%,55% 43%);
 transform:translate3d(calc(var(--x)*.35),calc(var(--y)*.20),145px) scale(.99);
 filter:brightness(1.06) drop-shadow(0 14px 14px rgba(0,0,0,.32));
}
/* caminho e cercas */
.path{
 clip-path:polygon(10% 47%,87% 42%,100% 100%,0 100%);
 transform:translate3d(calc(var(--x)*.50),calc(var(--y)*.29),220px) scale(.955);
 filter:drop-shadow(0 15px 12px rgba(0,0,0,.25));
}
/* objetos do primeiro plano */
.front{
 clip-path:polygon(0 62%,100% 60%,100% 100%,0 100%);
 transform:translate3d(calc(var(--x)*.82),calc(var(--y)*.48),330px) scale(.91);
 filter:brightness(1.08) drop-shadow(0 18px 13px rgba(0,0,0,.35));
}
/* troncos laterais, ainda mais perto */
.frame{
 clip-path:polygon(0 0,16% 0,12% 75%,0 100%,0 0,100% 0,84% 0,89% 74%,100% 100%);
 transform:translate3d(calc(var(--x)*1.05),calc(var(--y)*.60),420px) scale(.87);
 filter:drop-shadow(0 20px 18px rgba(0,0,0,.45));
}
.vignette{
 position:absolute;inset:0;pointer-events:none;
 background:radial-gradient(circle at 60% 50%,transparent 42%,rgba(0,0,0,.28) 100%);
}
.hint{
 position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));
 transform:translateX(-50%);
 color:white;background:rgba(0,0,0,.58);backdrop-filter:blur(8px);
 padding:9px 14px;border-radius:30px;font-size:13px;white-space:nowrap;
 transition:opacity .5s;
}
</style>
</head>
<body>
<div id="stage">
 <div id="scene">
  <div class="layer base"></div>
  <div class="layer sky"></div>
  <div class="layer forest"></div>
  <div class="layer house"></div>
  <div class="layer path"></div>
  <div class="layer front"></div>
  <div class="layer frame"></div>
 </div>
 <div class="vignette"></div>
 <div class="hint" id="hint">Arraste o dedo para explorar a profundidade</div>
</div>
<script>
const root=document.documentElement, stage=document.getElementById("stage"), hint=document.getElementById("hint");
function move(cx,cy){
 const r=stage.getBoundingClientRect();
 let nx=((cx-r.left)/r.width-.5)*2, ny=((cy-r.top)/r.height-.5)*2;
 nx=Math.max(-1,Math.min(1,nx)); ny=Math.max(-1,Math.min(1,ny));
 root.style.setProperty("--x",(nx*34)+"px");
 root.style.setProperty("--y",(ny*22)+"px");
 root.style.setProperty("--ry",(nx*8)+"deg");
 root.style.setProperty("--rx",(-ny*5)+"deg");
 hint.style.opacity="0";
}
stage.addEventListener("pointerdown",e=>move(e.clientX,e.clientY));
stage.addEventListener("pointermove",e=>{if(e.buttons||e.pointerType==="touch")move(e.clientX,e.clientY)});
stage.addEventListener("touchmove",e=>{const t=e.touches[0];move(t.clientX,t.clientY);e.preventDefault()},{passive:false});
</script>
</body>
</html>
