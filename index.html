<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Protótipo 3D: Bosque da Bruxa</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a0a2a;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: #dcbfff;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
            font-size: 14px;
            z-index: 10;
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="info">Arraste para girar, pinça para zoom</div>

    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a0a2a);
            scene.fog = new THREE.FogExp2(0x1a0a2a, 0.018);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.body.appendChild(renderer.domElement);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(11, 8, 16);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.minDistance = 7;
            controls.maxDistance = 28;
            controls.maxPolarAngle = Math.PI * 0.49;
            controls.target.set(0, 2, 0);
            controls.update();

            scene.add(new THREE.HemisphereLight(0x6a4c93, 0x221126, 1.5));

            const moonLight = new THREE.DirectionalLight(0xfff0d0, 1.2);
            moonLight.position.set(-10, 18, 8);
            moonLight.castShadow = true;
            scene.add(moonLight);

            // Base do diorama
            const base = new THREE.Mesh(
                new THREE.CylinderGeometry(8, 8.4, 0.65, 48),
                new THREE.MeshStandardMaterial({ color: 0x2a1732, roughness: 0.95 })
            );
            base.position.y = -0.35;
            base.receiveShadow = true;
            scene.add(base);

            const grass = new THREE.Mesh(
                new THREE.CylinderGeometry(7.8, 7.8, 0.18, 48),
                new THREE.MeshStandardMaterial({ color: 0x24351e, roughness: 1 })
            );
            grass.position.y = 0.02;
            grass.receiveShadow = true;
            scene.add(grass);

            // Caminho
            const stoneMat = new THREE.MeshStandardMaterial({ color: 0x74666e, roughness: 1 });
            const stones = [[0,7],[.8,5.8],[-.5,4.8],[.6,3.6],[-.2,2.5],[.8,1.4],[1.8,.4]];
            stones.forEach(([x,z],i)=>{
                const s = new THREE.Mesh(new THREE.CylinderGeometry(.75,.82,.12,10), stoneMat);
                s.position.set(x,.14,z-3.4);
                s.rotation.y = i*.47;
                s.scale.z = .65;
                s.receiveShadow = true;
                scene.add(s);
            });

            // Casa
            const house = new THREE.Group();
            house.position.set(3.2,0,-1);
            scene.add(house);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x51351f, roughness: .9 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(4.2,3.8,3.5), wallMat);
            body.position.y = 2;
            body.castShadow = body.receiveShadow = true;
            house.add(body);

            const roofMat = new THREE.MeshStandardMaterial({ color: 0x2b1738, roughness: .85 });
            const roof = new THREE.Mesh(new THREE.ConeGeometry(3.4,3.6,4), roofMat);
            roof.position.y = 5.45;
            roof.rotation.y = Math.PI/4;
            roof.scale.z = .85;
            roof.castShadow = true;
            house.add(roof);

            const chimney = new THREE.Mesh(
                new THREE.BoxGeometry(.55,2,.7),
                new THREE.MeshStandardMaterial({color:0x3a3035, roughness:1})
            );
            chimney.position.set(1.15,5.8,-.35);
            chimney.rotation.z = -.18;
            chimney.castShadow = true;
            house.add(chimney);

            const door = new THREE.Mesh(
                new THREE.BoxGeometry(1.05,2.1,.08),
                new THREE.MeshStandardMaterial({color:0x2e1710})
            );
            door.position.set(0,1.15,1.79);
            house.add(door);

            const winMat = new THREE.MeshStandardMaterial({
                color:0xffb02e, emissive:0xff7a00, emissiveIntensity:2
            });
            [-1.1,1.1].forEach(x=>{
                const w = new THREE.Mesh(new THREE.PlaneGeometry(.8,1.05), winMat);
                w.position.set(x,2.55,1.77);
                house.add(w);
            });
            const warm = new THREE.PointLight(0xff7b21, 5, 8, 2);
            warm.position.set(0,2.4,2.1);
            house.add(warm);

            // árvores
            const trunkMat = new THREE.MeshStandardMaterial({color:0x392317,roughness:1});
            const pineMat = new THREE.MeshStandardMaterial({color:0x173323,roughness:1});

            function pine(x,z,s=1){
                const g = new THREE.Group();
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.18,.28,1.5,8),trunkMat);
                trunk.position.y=.75;
                g.add(trunk);
                for(let i=0;i<3;i++){
                    const c = new THREE.Mesh(new THREE.ConeGeometry(1.3-i*.2,2.5,10),pineMat);
                    c.position.y=1.7+i*.9;
                    c.castShadow=true;
                    g.add(c);
                }
                g.position.set(x,0,z);
                g.scale.setScalar(s);
                scene.add(g);
            }
            pine(-5,-3,1.2); pine(-6,1,.95); pine(-4.5,4,.8); pine(6,-3,.85);

            // cercas
            const fenceMat = new THREE.MeshStandardMaterial({color:0x5a3923,roughness:1});
            function fenceLine(x,z,count,rot=0){
                const g=new THREE.Group();
                for(let i=0;i<count;i++){
                    const p=new THREE.Mesh(new THREE.BoxGeometry(.22,1.4,.22),fenceMat);
                    p.position.set(i*1.15,.7,0); p.castShadow=true; g.add(p);
                    if(i<count-1){
                        const r=new THREE.Mesh(new THREE.BoxGeometry(1.15,.15,.15),fenceMat);
                        r.position.set(i*1.15+.57,.85,0); g.add(r);
                    }
                }
                g.position.set(x,0,z); g.rotation.y=rot; scene.add(g);
            }
            fenceLine(-5.5,3.6,5,.08);
            fenceLine(-2.5,-4.6,4,-.35);

            // Abóboras
            function pumpkin(x,z,s=1){
                const g=new THREE.Group();
                const mat=new THREE.MeshStandardMaterial({color:0xe86d16,roughness:.7});
                for(let i=0;i<5;i++){
                    const p=new THREE.Mesh(new THREE.SphereGeometry(.5,16,12),mat);
                    p.scale.set(.72,.78,.55);
                    p.rotation.y=i*Math.PI/5;
                    g.add(p);
                }
                const stem=new THREE.Mesh(new THREE.CylinderGeometry(.07,.1,.35,7),
                    new THREE.MeshStandardMaterial({color:0x35511f}));
                stem.position.y=.48; g.add(stem);
                g.position.set(x,.48*s,z); g.scale.setScalar(s);
                scene.add(g);
            }
            pumpkin(-2.6,4.7,1.5); pumpkin(-.8,3.8,.9); pumpkin(5.1,1.2,.95); pumpkin(4.7,2.4,.65);

            // Cogumelos
            function mushroom(x,z,s=.5){
                const g=new THREE.Group();
                const st=new THREE.Mesh(new THREE.CylinderGeometry(.12,.15,.55,8),
                    new THREE.MeshStandardMaterial({color:0xeadfc2}));
                st.position.y=.27;
                const cap=new THREE.Mesh(new THREE.SphereGeometry(.42,12,8,0,Math.PI*2,0,Math.PI/2),
                    new THREE.MeshStandardMaterial({color:0xb93833}));
                cap.position.y=.52; cap.scale.y=.7;
                g.add(st,cap); g.position.set(x,0,z); g.scale.setScalar(s); scene.add(g);
            }
            mushroom(-3.6,3.3,1); mushroom(-3.1,3.6,.7); mushroom(2.5,3.8,.65);

            // Lampião
            const lampGroup = new THREE.Group();
            lampGroup.position.set(-1.8,0,1.5);
            const post = new THREE.Mesh(new THREE.CylinderGeometry(.09,.12,3,8),trunkMat);
            post.position.y=1.5; lampGroup.add(post);
            const lamp = new THREE.Mesh(new THREE.BoxGeometry(.55,.7,.55),
                new THREE.MeshStandardMaterial({color:0xffc65a,emissive:0xff8a00,emissiveIntensity:2}));
            lamp.position.y=2.8; lampGroup.add(lamp);
            const ll = new THREE.PointLight(0xff8a20,3.5,6,2); ll.position.y=2.8; lampGroup.add(ll);
            scene.add(lampGroup);

            // Lua no fundo
            const moon = new THREE.Mesh(
                new THREE.SphereGeometry(2.1,32,24),
                new THREE.MeshBasicMaterial({color:0xffe7a3})
            );
            moon.position.set(-10,12,-12);
            scene.add(moon);

            // estrelas simples
            const starGeo = new THREE.BufferGeometry();
            const pts=[];
            for(let i=0;i<180;i++){
                pts.push((Math.random()-.5)*45, 5+Math.random()*18, -8-Math.random()*15);
            }
            starGeo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
            scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xd8c6ff,size:.07})));

            window.addEventListener('resize',()=>{
                camera.aspect=innerWidth/innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(innerWidth,innerHeight);
            });
        }

        function animate(){
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene,camera);
        }
    </script>
</body>
</html>
